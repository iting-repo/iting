spring.config.import=optional:file:.env[.properties]

# ===============================
# APPLICATION
# ===============================
spring.application.name=iting-job-portal
server.port=8080
server.error.include-message=always

# ===============================
# DATABASE CONFIGURATION
# ===============================
# For local development (outside Docker) - connect to ITing PostgreSQL Docker on port 5433
#spring.datasource.url=jdbc:postgresql://localhost:5433/iting_job_portal
#spring.datasource.username=postgres
#spring.datasource.password=250904
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=lengocnhuy
spring.datasource.driver-class-name=org.postgresql.Driver

# Note: When running in Docker, these values are overridden by environment variables in docker-compose.yml

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial Setup
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.default-schema=public

# ===============================
# SQL INITIALIZATION
# ===============================
# Disabled - schema imported manually via docker or psql
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===============================
# REFRESH TOKEN CONFIGURATION
# ===============================
jwt.refresh.secret=7134743777217A25432A462D4A614E645267556B58703272357538782F413F4428472B4B6250645367566B5970
jwt.refresh.expiration=604800000
jwt.refresh.max-tokens-per-user=5

# ===============================
# SECURITY LOG
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# AWS S3 CONFIGURATION
# ===============================
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:datn-jobweb}
aws.enabled=${AWS_ENABLED:true}

# ===============================
# MAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ACTUATOR HEALTH - disable mail health check (mail is optional)
management.health.mail.enabled=false
management.endpoint.health.show-details=always

# ===============================
# GOOGLE OAUTH2 CONFIGURATION
# ===============================
google.client.id=435696030871-3vk0212ha2spir23etro25cmub2nmdls.apps.googleusercontent.com
google.client.secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_HERE}

# ===============================
# MULTIPART CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# KAFKA CONFIGURATION
# ===============================
# Set to true only if you have Kafka running (e.g., via docker-compose)
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kyb-notification-group
spring.kafka.listener.auto-startup=${spring.kafka.enabled}

# ===============================
# GEMINI AI CONFIGURATION
# ===============================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ===============================
# OPENAI CONFIGURATION (Embeddings)
# ===============================
openai.api.key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
