# ===============================
# PRODUCTION CONFIGURATION FOR RENDER + AIVEN
# ===============================

spring.application.name=iting-job-portal

# Server port - Render uses PORT environment variable
server.port=${PORT:8080}

# ===============================
# DATASOURCE (Aiven PostgreSQL Cloud)
# Sử dụng Environment Variables để bảo mật
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for production
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
# PRODUCTION: sử dụng 'update' để giữ dữ liệu, không xóa bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=POSTGRESQL

# Đợi Hibernate tạo bảng xong mới chạy data.sql
spring.jpa.defer-datasource-initialization=false

# ===============================
# DATA INITIALIZATION
# ===============================
# Chỉ chạy data.sql lần đầu tiên (never = tắt sau khi đã có data)
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# JWT CONFIGURATION
# Sử dụng Environment Variable cho secret key
# ===============================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.iting.jobportal=INFO
logging.level.org.hibernate.SQL=WARN

# ===============================
# ACTUATOR (Health checks for Render)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

