# ===============================
# PRODUCTION CONFIGURATION
# ===============================
# This file overrides application.properties when running with -Dspring.profiles.active=prod

spring.application.name=iting-job-portal

# ===============================
# DATABASE - RDS PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database=POSTGRESQL

# Đợi Hibernate tạo bảng xong mới chạy data.sql
# spring.jpa.defer-datasource-initialization=false (already defined above)

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.default-schema=public

# ===============================
# SWAGGER - disable in production
# ===============================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===============================
# JWT - from environment variables
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.refresh.max-tokens-per-user=5

# ===============================
# AWS S3
# ===============================
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:datn-jobweb}
aws.enabled=true

# ===============================
# MAIL (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# GOOGLE OAUTH2
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}

# ===============================
# GEMINI AI
# ===============================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ===============================
# OPENAI (optional)
# ===============================
openai.api.key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# ===============================
# ML MICROSERVICE (Python FastAPI)
# ===============================
ml.service.url=${ML_SERVICE_URL:https://deeatetee-ai-matching-api.hf.space}
ml.service.timeout=30
ml.service.enabled=${ML_SERVICE_ENABLED:true}
ml.service.api-key=${API_SECRET_KEY:api-key-ai-job-matching}

# ===============================
# KAFKA - disabled for initial deploy
# ===============================
spring.kafka.enabled=false
spring.kafka.listener.auto-startup=false

# ===============================
# LOGGING - Production level
# ===============================
logging.level.root=INFO
logging.level.com.iting=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false

# ===============================
# CORS - Set to your CloudFront domain
# ===============================
cors.allowed-origins=${CORS_ORIGINS:https://iting.vn}

# ===============================
# SERVER
# ===============================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=30m
spring.cache.redis.cache-null-values=false

# Rate Limiting (used by RedisRateLimitingService)
iting.rate-limit.enabled=true
iting.rate-limit.default-max-requests=100
iting.rate-limit.default-window-seconds=60
