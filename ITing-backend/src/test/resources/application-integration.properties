# ============================================================
# Integration test profile — H2 in-memory in PostgreSQL mode
# Activate with: @ActiveProfiles("integration")
# ============================================================

# H2 in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:itingtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate auto-generate schema from JPA entities (skip Flyway)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Flyway — uses Postgres-specific SQL (BIGSERIAL etc.)
spring.flyway.enabled=false

# Don't run schema.sql / data.sql — they contain Postgres-only syntax
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Disable heavy infra (Redis, Kafka) for integration tests
# Keep MailSender auto-config so EmailServiceImpl can be constructed
# (We use dummy SMTP host — actual sending won't work, but bean exists)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.kafka.enabled=false
spring.cache.type=none

# Mail config — bean is auto-configured but won't actually send
spring.mail.host=localhost
spring.mail.port=25
spring.mail.test-connection=false

# Stub JWT and external service keys
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh.secret=7134743777217A25432A462D4A614E645267556B58703272357538782F413F4428472B4B6250645367566B5970
jwt.refresh.expiration=604800000
jwt.refresh.max-tokens-per-user=5

