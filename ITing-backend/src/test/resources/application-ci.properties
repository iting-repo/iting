spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:lengocnhuy}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.default-schema=${DB_SCHEMA:postgres}

# Integration tests dùng @SpringBootTest → load full context. S3Client cần tồn tại (dù không call AWS).
aws.enabled=true
aws.s3.access-key=test
aws.s3.secret-key=test
aws.s3.region=ap-southeast-1
aws.s3.bucket=test-bucket

# Tắt mail/redis health để không phụ thuộc service ngoài
management.health.mail.enabled=false
management.health.redis.enabled=false
spring.mail.username=test@example.com
spring.mail.password=testpassword

# AI/Gemini placeholders — không call thật trong test, chỉ cần resolve được
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
google.client.secret=

# Tắt features external
app.outbox.enabled=false
app.cluster.messaging.enabled=false
spring.kafka.enabled=false
