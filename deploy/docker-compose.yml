# ==========================================
# ITing Production Docker Compose
# ==========================================
# Managed locally, deployed via GitHub Actions tagged releases.
# EC2 path: /opt/iting/iting-repo/deploy/docker-compose.yml
# Secrets: /opt/iting/.env + /opt/iting/.env.prod (NOT committed)

networks:
  iting-net:
    external: true

volumes:
  iting_redis_data:
    external: true
  iting_nginx_ssl:
    external: true

services:
  # ========================================
  # Redis - Caching & Rate Limiting
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: iting-redis
    restart: unless-stopped
    networks:
      - iting-net
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - iting_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ========================================
  # Backend - Spring Boot API
  # ========================================
  backend:
    image: ${BACKEND_IMAGE}
    container_name: iting-backend
    restart: unless-stopped
    networks:
      - iting-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:-public}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${DB_SCHEMA:-public}
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-public}
      SPRING_FLYWAY_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      SPRING_FLYWAY_USER: ${DB_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKERS:-localhost:9092}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_CACHE_TYPE: redis
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # AWS S3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ENABLED: ${AWS_ENABLED}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Email
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Google OAuth
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_ITING: INFO
      # App
      SPRING_APPLICATION_NAME: iting-job-portal
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      SERVER_SHUTDOWN: graceful
      # OpenTelemetry
      OTEL_JAVAAGENT_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: iting-backend
      OTEL_RESOURCE_ATTRIBUTES: service.name=iting-backend,service.namespace=iting,deployment.environment=${DEPLOY_ENV}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 240s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ========================================
  # Frontend - React SPA
  # ========================================
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: iting-frontend
    restart: unless-stopped
    networks:
      - iting-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ========================================
  # Nginx - Reverse Proxy
  # ========================================
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: iting-nginx
    restart: unless-stopped
    networks:
      - iting-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/api.datnhk252iting.dpdns.org.conf:/etc/nginx/conf.d/api.datnhk252iting.dpdns.org.conf:ro
      - ./config/nginx/datnhk252iting.dpdns.org.conf:/etc/nginx/conf.d/datnhk252iting.dpdns.org.conf:ro
      - ./config/nginx/monitor.datnhk252iting.dpdns.org.conf:/etc/nginx/conf.d/monitor.datnhk252iting.dpdns.org.conf:ro
      - ./config/nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./config/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - iting_nginx_ssl:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # Certbot - SSL Renewal
  # ========================================
  certbot:
    image: certbot/certbot:latest
    container_name: iting-certbot
    restart: "no"
    networks:
      - iting-net
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
