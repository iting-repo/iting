services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../ITing-backend
      dockerfile: Dockerfile.prod
    image: iting-backend:local
    env_file:
      - .env.local
    environment:
      # Dockerfile.prod luôn bật spring.profiles.active=prod; SPRING_PROFILES_ACTIVE ở đây không đổi profile.
      OTEL_JAVAAGENT_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ../ITing-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8081}
    image: iting-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - backend
