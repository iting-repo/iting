server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== Security headers (Lighthouse Best Practices) =====
    # CSP cho SPA: cho phép inline cho style do Tailwind/runtime injection.
    # 'wasm-unsafe-eval' không bật — chỉ thêm nếu app dùng wasm.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ===== Compression =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ===== Static assets: long cache =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Phải re-add security headers vì location block override add_header inheritance.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ===== robots.txt / sitemap: serve trực tiếp, content-type plain =====
    location = /robots.txt {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ===== SPA fallback =====
    location / {
        # index.html không cache để deploy mới được nhận ngay.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
