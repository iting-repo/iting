# =====================================================
# Performance & Accessibility — chạy weekly + on-demand
# =====================================================
# - k6 smoke (≤2 phút) chống regress mỗi tuần
# - Lighthouse audit production URL
#
# Chạy thủ công: Actions → "Performance & A11y" → Run workflow

name: Performance & A11y

on:
  schedule:
    - cron: "0 18 * * 1"   # 18:00 UTC Thứ 2 = 01:00 thứ 3 GMT+7
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL test (mặc định production)"
        required: false
        default: "https://datnhk252iting.dpdns.org"
      vus:
        description: "Số virtual users k6"
        required: false
        default: "50"

jobs:
  k6-smoke:
    name: k6 Performance Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/k6-smoke.js
          flags: --out json=k6-result.json
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://datnhk252iting.dpdns.org' }}
          VUS: ${{ github.event.inputs.vus || '50' }}

      - name: Upload k6 result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-result
          path: k6-result.json
          retention-days: 30

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ github.event.inputs.target_url || 'https://datnhk252iting.dpdns.org' }}
            ${{ github.event.inputs.target_url || 'https://datnhk252iting.dpdns.org' }}/jobs
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
