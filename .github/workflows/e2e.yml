# =====================================================
# E2E Cross-Browser Test — Playwright (NFR 3.3.7)
# =====================================================
# Chạy E2E suite trên 3 engine (chromium/firefox/webkit)
# Trigger:
#   - On PR (smoke subset)
#   - Weekly (full suite)
#   - Manual

name: E2E Cross-Browser

on:
  pull_request:
    branches: [main]
    paths:
      - "ITing-frontend/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 19 * * 3"   # 19:00 UTC Thứ 4
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ITing-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ITing-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ITing-frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        working-directory: ITing-frontend
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BASE_URL: https://datnhk252iting.dpdns.org

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: ITing-frontend/playwright-report/
          retention-days: 14
