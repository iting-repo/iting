# ==========================================
# ITing Deploy Pipeline
# ==========================================
# Triggers: ONLY on tags (v*)
#
# Steps:
#   1. SSH into EC2
#   2. Pull latest images from GHCR
#   3. Deploy with docker compose
#   4. Health check
#   5. Notify Discord

name: Deploy to EC2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/iting-backend:${{ github.ref_name }}
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/iting-frontend:${{ github.ref_name }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://datnhk252iting.dpdns.org

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for tagged images in GHCR
        run: |
          echo "Waiting for ${{ env.BACKEND_IMAGE }}"
          echo "Waiting for ${{ env.FRONTEND_IMAGE }}"

          for i in {1..30}; do
            if docker manifest inspect "${{ env.BACKEND_IMAGE }}" >/dev/null 2>&1 && \
               docker manifest inspect "${{ env.FRONTEND_IMAGE }}" >/dev/null 2>&1; then
              echo "Tagged images are available"
              exit 0
            fi

            echo "Tagged images not ready yet... attempt $i/30"
            sleep 10
          done

          echo "Timed out waiting for tagged images in GHCR"
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/iting/iting-repo

            echo "::group::Deploy context"
            echo "tag=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "::endgroup::"

            # Sync repo to the pushed tag
            git fetch --all --tags --prune
            git checkout ${{ github.ref_name }}
            cd /opt/iting/iting-repo/deploy

            echo "::group::Resolved image references"
            python3 - <<'PY'
            from pathlib import Path

            env = {}
            for path in (Path("/opt/iting/.env"), Path("/opt/iting/.env.prod")):
                if not path.exists():
                    continue
                for raw_line in path.read_text(encoding="utf-8").splitlines():
                    line = raw_line.strip()
                    if not line or line.startswith("#") or "=" not in line:
                        continue
                    key, value = line.split("=", 1)
                    env[key] = value

            print(f"BACKEND_IMAGE(from-ec2-env)={env.get('BACKEND_IMAGE', 'missing')}")
            print(f"FRONTEND_IMAGE(from-ec2-env)={env.get('FRONTEND_IMAGE', 'missing')}")
            print(f"SPRING_PROFILES_ACTIVE={env.get('SPRING_PROFILES_ACTIVE', 'missing')}")
            PY
            echo "BACKEND_IMAGE(from-workflow)=${{ env.BACKEND_IMAGE }}"
            echo "FRONTEND_IMAGE(from-workflow)=${{ env.FRONTEND_IMAGE }}"
            echo "::endgroup::"

            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull latest images
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              pull

            echo "::group::Pulled image metadata"
            docker inspect --format='backend image={{.Image}} created={{.Created}} started={{.State.StartedAt}}' iting-backend 2>/dev/null || true
            docker inspect --format='frontend image={{.Image}} created={{.Created}} started={{.State.StartedAt}}' iting-frontend 2>/dev/null || true
            docker images --digests --format 'table {{.Repository}}\t{{.Tag}}\t{{.Digest}}\t{{.ID}}\t{{.CreatedSince}}' | grep 'iting-' || true
            echo "::endgroup::"

            # Deploy
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Verify
            sleep 15
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              ps

            # Internal health checks with retries
            BACKEND_WAIT_STARTED_AT=$(date +%s)
            for i in {1..40}; do
              curl -sf http://localhost/ >/dev/null && break
              echo "Waiting for nginx frontend... attempt $i/40"
              sleep 10
            done

            for i in {1..40}; do
              BACKEND_STATE=$(docker inspect -f '{{.State.Status}}' iting-backend 2>/dev/null || echo "missing")
              if [ "$BACKEND_STATE" != "running" ]; then
                echo "Backend container is not running (state=$BACKEND_STATE)"
                docker compose \
                  -f docker-compose.yml \
                  --env-file /opt/iting/.env \
                  --env-file /opt/iting/.env.prod \
                  ps
                docker logs --tail 200 iting-backend || true
                exit 1
              fi

              BACKEND_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' iting-backend 2>/dev/null || echo "missing")
              BACKEND_STARTED_AT=$(docker inspect -f '{{.State.StartedAt}}' iting-backend 2>/dev/null || echo "missing")
              BACKEND_RESTARTS=$(docker inspect -f '{{.RestartCount}}' iting-backend 2>/dev/null || echo "missing")
              if [ "$BACKEND_HEALTH" = "healthy" ]; then
                break
              fi

              if [ "$BACKEND_HEALTH" = "unhealthy" ]; then
                echo "Backend container is unhealthy"
                docker inspect -f '{{json .State.Health}}' iting-backend || true
                docker logs --tail 200 iting-backend || true
                exit 1
              fi

              echo "Backend state=$BACKEND_STATE health=$BACKEND_HEALTH"
              echo "Backend startedAt=$BACKEND_STARTED_AT restarts=$BACKEND_RESTARTS"
              echo "Backend wait elapsed=$(( $(date +%s) - BACKEND_WAIT_STARTED_AT ))s"
              docker inspect -f '{{json .State.Health.Log}}' iting-backend 2>/dev/null || true
              echo "Waiting for backend health... attempt $i/40"
              sleep 10
            done

            curl -sf http://localhost/ >/dev/null
            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' iting-backend)" = "healthy"

            echo "::group::Local API route verification"
            API_LOCAL_STATUS=$(curl -skS -o /tmp/iting-api-health.json -w '%{http_code}' \
              --resolve api.datnhk252iting.dpdns.org:443:127.0.0.1 \
              https://api.datnhk252iting.dpdns.org/actuator/health || true)
            echo "Local API HTTPS status=$API_LOCAL_STATUS"
            python3 -c "from pathlib import Path; path = Path('/tmp/iting-api-health.json'); print(path.read_text(encoding='utf-8', errors='replace')[:500] if path.exists() else 'local api body missing')"
            echo "::endgroup::"

      - name: Health check
        run: |
          for i in {1..15}; do
            FRONTEND_STATUS=$(curl -skS -o /tmp/frontend-health.txt -w '%{http_code}' https://datnhk252iting.dpdns.org/ || true)
            API_STATUS=$(curl -skS -o /tmp/api-health.txt -w '%{http_code}' https://api.datnhk252iting.dpdns.org/actuator/health || true)

            echo "External health attempt $i/15 frontend_status=$FRONTEND_STATUS api_status=$API_STATUS"
            echo "API response preview:"
            python3 -c "from pathlib import Path; path = Path('/tmp/api-health.txt'); print(path.read_text(encoding='utf-8', errors='replace')[:500] if path.exists() else 'api body missing')"

            if [ "$FRONTEND_STATUS" = "200" ] && [ "$API_STATUS" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "External health check did not reach HTTP 200"
          exit 1

      - name: Notify Discord - Success
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ Deploy succeeded! Tag: ${{ github.ref_name }} by ${{ github.actor }}"}'

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content":"🚨 Deploy FAILED! Tag: ${{ github.ref_name }} by ${{ github.actor }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
