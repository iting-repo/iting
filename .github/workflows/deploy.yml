# ==========================================
# ITing Deploy Pipeline
# ==========================================
# Triggers: ONLY on tags (v*)
#
# Steps:
#   1. SSH into EC2
#   2. Pull latest images from GHCR
#   3. Deploy with docker compose
#   4. Health check
#   5. Notify Discord

name: Deploy to EC2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

# Tránh queue chồng chất khi push nhiều tag liên tiếp. Mỗi tag là 1 deploy
# tuần tự — KHÔNG cancel-in-progress vì SSH/docker compose recreate đang
# chạy dở dang dễ để server ở trạng thái lạ.
concurrency:
  group: deploy-to-ec2
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/iting-backend:${{ github.ref_name }}
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/iting-frontend:${{ github.ref_name }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://datnhk252iting.dpdns.org

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GHCR_PAT thay GITHUB_TOKEN: sau khi transfer repo sang org
          # iting-repo, default GITHUB_TOKEN bị denied khi read private
          # GHCR packages → manifest inspect luôn fail → deploy timeout.
          password: ${{ secrets.GHCR_PAT }}

      - name: Wait for tagged images in GHCR
        # 120 attempts × 30s = 60 phút. Cần buffer rộng vì:
        #   - Push nhiều tag liên tiếp → CI queue trên GitHub runners
        #     (free tier limit) → CI cho tag X có thể chờ 30+ phút mới
        #     được runner trước khi build/push image.
        #   - Cache miss (entity changes) → backend Docker build full
        #     từ jdk image = 10-15 phút.
        # Tổng 60 phút an toàn cho cả 2 trường hợp cộng dồn.
        run: |
          echo "Waiting for ${{ env.BACKEND_IMAGE }}"
          echo "Waiting for ${{ env.FRONTEND_IMAGE }}"

          for i in {1..120}; do
            if docker manifest inspect "${{ env.BACKEND_IMAGE }}" >/dev/null 2>&1 && \
               docker manifest inspect "${{ env.FRONTEND_IMAGE }}" >/dev/null 2>&1; then
              echo "Tagged images are available"
              exit 0
            fi

            echo "Tagged images not ready yet... attempt $i/120"
            sleep 30
          done

          echo "Timed out waiting for tagged images in GHCR"
          exit 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/iting/iting-repo

            # Sync repo to the pushed tag
            git fetch --all --tags --prune
            git checkout ${{ github.ref_name }}
            cd /opt/iting/iting-repo/deploy

            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Free disk BEFORE pull — backend image is ~820MB, EC2 has 29GB
            # root and we used to keep every v1.0.x tag (33GB+ accumulated →
            # 100% full → pull "succeeded silently" while container stuck on
            # old version). Remove unused tagged images >24h old, then dangling.
            docker image prune -a -f --filter "until=24h"
            docker image prune -f

            # Inject/rotate Gemini API key in .env.prod (idempotent, no duplicate lines).
            # Source: GitHub Actions secret GEMINI_API_KEY (repo Settings → Secrets → Actions).
            # Set this in: https://github.com/iting-repo/iting/settings/secrets/actions
            # Value: Google AI Studio API key from https://aistudio.google.com/apikey
            if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "::error::GEMINI_API_KEY secret is not set in GitHub repo settings"
              echo "::error::Go to Settings → Secrets and variables → Actions → New repository secret"
              exit 1
            fi

            # Ensure .env.prod exists (first-time deploy may not have it).
            # .env (base) is created by bootstrap, .env.prod is for prod-only overrides + secrets.
            touch /opt/iting/.env.prod
            chmod 600 /opt/iting/.env.prod

            if grep -q '^GEMINI_API_KEY=' /opt/iting/.env.prod; then
              sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" /opt/iting/.env.prod
            else
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> /opt/iting/.env.prod
            fi

            # Also inject/rotate other Gemini-related envs from GitHub secrets (optional overrides)
            if [ -n "${{ secrets.GEMINI_API_URL }}" ]; then
              if grep -q '^GEMINI_API_URL=' /opt/iting/.env.prod; then
                sed -i "s|^GEMINI_API_URL=.*|GEMINI_API_URL=${{ secrets.GEMINI_API_URL }}|" /opt/iting/.env.prod
              else
                echo "GEMINI_API_URL=${{ secrets.GEMINI_API_URL }}" >> /opt/iting/.env.prod
              fi
            fi

            if [ -n "${{ secrets.GEMINI_API_MODEL }}" ]; then
              if grep -q '^GEMINI_API_MODEL=' /opt/iting/.env.prod; then
                sed -i "s|^GEMINI_API_MODEL=.*|GEMINI_API_MODEL=${{ secrets.GEMINI_API_MODEL }}|" /opt/iting/.env.prod
              else
                echo "GEMINI_API_MODEL=${{ secrets.GEMINI_API_MODEL }}" >> /opt/iting/.env.prod
              fi
            fi

            # Verify Gemini key was injected (sanity check, don't echo the key)
            if grep -q '^GEMINI_API_KEY=.\+' /opt/iting/.env.prod; then
              echo "✓ GEMINI_API_KEY injected successfully (key length: $(grep '^GEMINI_API_KEY=' /opt/iting/.env.prod | sed 's/^GEMINI_API_KEY=//' | wc -c))"
            else
              echo "::error::GEMINI_API_KEY injection failed — key is empty in .env.prod"
              exit 1
            fi

            # Pull latest images
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              pull

            # Deploy
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              up -d --remove-orphans

            # Final dangling-layer cleanup after recreate
            docker image prune -f

            # Backend start_period is 240s; wait before recycling nginx or external health checks
            echo "Waiting for backend container health (up to 10m)..."
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              wait --timeout 600 backend

            echo "Waiting for frontend container health (up to 3m)..."
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              wait --timeout 180 frontend

            # Refresh nginx after upstreams are healthy (avoids 502 during --no-deps recreate)
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" docker compose \
              -f docker-compose.yml \
              --env-file /opt/iting/.env \
              --env-file /opt/iting/.env.prod \
              up -d --no-deps --force-recreate nginx-proxy

      - name: Health check
        run: |
          set -euo pipefail

          check_url() {
            local name="$1"
            local url="$2"
            echo "Checking $name: $url"
            if curl -sf --retry 5 --retry-delay 5 --retry-all-errors "$url" >/dev/null; then
              echo "$name OK"
              return 0
            fi
            local code
            code="$(curl -sk -o /dev/null -w '%{http_code}' "$url" || echo '000')"
            echo "::error::$name failed (HTTP $code): $url"
            curl -sk "$url" | head -c 500 || true
            return 1
          }

          check_url "Frontend" "https://datnhk252iting.dpdns.org/"
          check_url "API health" "https://api.datnhk252iting.dpdns.org/actuator/health"

      - name: Notify Discord - Success
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ Deploy succeeded! Tag: ${{ github.ref_name }} by ${{ github.actor }}"}'

      - name: Notify Discord - Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content":"🚨 Deploy FAILED! Tag: ${{ github.ref_name }} by ${{ github.actor }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
