# ==========================================
# ITing CI Pipeline
# ==========================================
# Triggers:
#   - Every push to main/develop
#   - Every pull request to main
#   - Every tag (v*)
#
# Jobs:
#   1. Backend: Build + Test
#   2. Frontend: Build + Test
#   3. Security: SAST + Dependency Scan
#   4. Docker: Build + Push to GHCR (on push only)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  # ========================================
  # Job 1: Backend Build & Test
  # ========================================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Build backend
        working-directory: ITing-backend
        run: mvn -B clean package -DskipTests

      - name: Run tests
        working-directory: ITing-backend
        run: mvn -B test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ITing-backend/target/*.jar
          retention-days: 5

  # ========================================
  # Job 2: Frontend Build & Test
  # ========================================
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ITing-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ITing-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ITing-frontend
        run: npm run build -- --env APP_ENV=production
        env:
          VITE_API_BASE: https://datnhk252iting.dpdns.org

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ITing-frontend/dist/
          retention-days: 5

  # ========================================
  # Job 3: Security Scanning
  # ========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # ========================================
  # Job 4: Build & Push Docker Images
  # ========================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ITing-backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ITing-frontend/dist/

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./ITing-backend
          file: ./ITing-backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ITing-frontend
          file: ./ITing-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-frontend:latest
          build-args: |
            VITE_API_BASE=https://datnhk252iting.dpdns.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
