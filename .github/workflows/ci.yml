# ==========================================
# ITing CI Pipeline
# ==========================================
# Triggers:
#   - Every push to main/develop
#   - Every pull request to main
#   - Every tag (v*)
#
# Jobs:
#   1. Backend: Build + Test
#   2. Frontend: Build + Test
#   3. Security: SAST + Dependency Scan
#   4. Docker: Build + Push to GHCR (on push only)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

# Branch/PR/tag → 1 nhóm riêng. Khi push tag mới chồng lên tag cũ (rapid
# tagging cho test/release work), CI của tag cũ bị cancel → giải phóng
# runner cho tag mới + tránh tích tụ queue 30+ phút.
# Tag deploy vẫn cần image: nếu CI tag cũ bị cancel, deploy.yml của tag cũ
# sẽ timeout (acceptable — chỉ tag mới nhất quan trọng).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  # ========================================
  # Job 1: Backend Build & Test
  # ========================================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Build backend
        working-directory: ITing-backend
        run: mvn -B clean package -DskipTests

      - name: Run tests + coverage (JaCoCo)
        working-directory: ITing-backend
        run: mvn -B test jacoco:report
        continue-on-error: true

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: ITing-backend/target/site/jacoco/
          retention-days: 14

      # Cache NVD CVE database (~500MB) — nếu không cache, lần đầu mất 30 phút
      - name: Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data/
          key: dep-check-db-${{ runner.os }}-v9
          restore-keys: dep-check-db-${{ runner.os }}-

      - name: OWASP Dependency-Check (Java)
        working-directory: ITing-backend
        # NVD_API_KEY tăng tốc 10× — đăng ký free tại
        # https://nvd.nist.gov/developers/request-an-api-key
        # Thêm secret repo: Settings → Secrets → Actions → NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_NVD_ARG=""
          if [ -n "${NVD_API_KEY}" ]; then
            EXTRA_NVD_ARG="-DnvdApiKey=${NVD_API_KEY}"
            echo "Using NVD API key for faster feed updates."
          else
            echo "NVD_API_KEY is empty. Feed updates may be slow."
          fi

          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.dependency-check-suppressions.xml \
            -DskipProvidedScope=true \
            -DknownExploitedEnabled=false \
            -DnvdApiDelay=2000 \
            ${EXTRA_NVD_ARG}
        continue-on-error: true

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: ITing-backend/target/dependency-check-report.html
          retention-days: 14

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ITing-backend/target/*.jar
          retention-days: 5

  # ========================================
  # Job 2: Frontend Build & Test
  # ========================================
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ITing-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ITing-frontend
        run: npm ci

      - name: npm audit (high+ severity)
        working-directory: ITing-frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: ESLint
        working-directory: ITing-frontend
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=200
        continue-on-error: true

      - name: Build frontend
        working-directory: ITing-frontend
        run: npm run build -- --env APP_ENV=production
        env:
          VITE_API_BASE: https://datnhk252iting.dpdns.org
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ITing-frontend/dist/
          retention-days: 5

  # ========================================
  # Job 3: Security Scanning
  # ========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # ========================================
  # Job 4: Build & Push Docker Images
  # ========================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # PAT thay GITHUB_TOKEN vì sau khi transfer repo sang org iting-repo,
          # default GITHUB_TOKEN bị denied khi push GHCR packages.
          password: ${{ secrets.GHCR_PAT }}

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ITing-backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ITing-frontend/dist/

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./ITing-backend
          file: ./ITing-backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-backend:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/iting-backend:{2}', env.REGISTRY, github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ITing-frontend
          file: ./ITing-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/iting-frontend:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/{1}/iting-frontend:{2}', env.REGISTRY, github.repository, github.ref_name) || '' }}
          build-args: |
            VITE_API_BASE=https://datnhk252iting.dpdns.org
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            REACT_APP_FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/iting-backend:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/iting-frontend:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
